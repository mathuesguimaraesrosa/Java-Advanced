spring:
  application:
    name: project-mgt
  datasource:
    url: jdbc:h2:file:./data/projectmgt
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
#      nao sao necessarias jpa
  jpa:
    hibernate:
      # se nao existe definicao desse atributo, ele é none por default
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Base64 de pelo menos 32 bytes (HS256). Valor de DESENVOLVIMENTO: em produção vem de variável de ambiente.
    # o que faz pegar o valor da variavel eamebiente é ${NOME_VARIAVEL_AMBIENTE} se eu quero com default
    # ${NOME_VARIAVEL_AMBIENTE:valor_dafault}
    secret: ${JWT_SECRET:cHJvamVjdG1ndC1kZXYtc2VjcmV0LWtleS0zMmJ5dGU}
    expiration-ms: 3600000   # 1 hora
  admin:
    email: ${ADMIN_EMAIL:admin@projectmgt.com}
    password: ${ADMIN_PASSWORD:Admin@12345}

