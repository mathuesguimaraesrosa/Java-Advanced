spring:
  application:
    name: project-mgt
  datasource:
    url: jdbc:h2:file:./data/projectmgt
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
#      nao sao necessarias jpa
  jpa:
    hibernate:
      # se nao existe definicao desse atributo, ele é none por default
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
    jwt:
        secret: ${JWT_SECRET:}

